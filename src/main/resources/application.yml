spring:
  application:
    name: readus-forum

  datasource:
    url: jdbc:postgresql://localhost:5432/readus_forum
    username: readus
    password: readus123
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jackson:
    property-naming-strategy: SNAKE_CASE

  mvc:
    problemdetails:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baselineOnMigrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: readus-forum
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID:your-client-id}
            client-secret: ${YANDEX_CLIENT_SECRET:your-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/yandex"
            authorization-grant-type: authorization_code
            scope:
              - login:email
              - login:avatar
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id

server:
  port: 8080
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    max-connections: 10000

app:
  jwt:
    secret: ${JWT_SECRET:readusForumSuperSecretKey2024With512BitsLongEnoughForHS256}
    expiration-ms: 86400000
  oauth:
    frontend-callback-url: ${OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth2/redirect}
  media:
    minio:
      endpoint: http://localhost:9000
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: readus-media
    max-file-size: 5242880
    temp-dir: ${java.io.tmpdir}/readus-media
  feed:
    update-interval-seconds: 300
    cache-ttl-seconds: 300

logging:
  level:
    com.readus: DEBUG
  pattern:
    console: "%d{ISO8601} %level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
